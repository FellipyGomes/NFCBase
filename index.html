<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Conecte-se com a gente</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: calc(100vh - 48px);
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 24px;
      padding: 34px 22px 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand h1 {
      font-size: 25px;
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin-top: 9px;
      color: #666;
      font-size: 15px;
      line-height: 1.45;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 76px;
      padding: 13px 16px;
      border: 1px solid #e2e2e2;
      border-radius: 17px;
      background: #fff;
      color: #111;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .option:active {
      transform: scale(.985);
      background: #fafafa;
    }

    .icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: #f2f2f2;
    }

    .text {
      flex: 1;
      min-width: 0;
    }

    .text strong {
      display: block;
      font-size: 16px;
      margin-bottom: 3px;
    }

    .text span {
      display: block;
      color: #777;
      font-size: 13px;
      line-height: 1.3;
    }

    .arrow {
      color: #aaa;
      font-size: 23px;
      line-height: 1;
    }

    .footer {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .nfc {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
      color: #666;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: no-preference) {
      .option:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="brand">
      <div class="logo">LOGO</div>

     <h1 id="titulo">Bem vindo</h1>
      <p>Escolha uma opção para continuar.</p>
    </header>

    <section class="options" aria-label="Opções de contato">

      <!-- WHATSAPP -->
     <a id="whatsapp" class="option"
         target="_blank"
         rel="noopener noreferrer">
        <div class="icon">
        <i class="fa-brands fa-whatsapp"></i>
		</div>
		<div class="text">
          <strong>WhatsApp</strong>
          <span>Entre em contato conosco</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <!-- INSTAGRAM -->
     <a id="instagram" class="option"
         target="_blank"
         rel="noopener noreferrer">
        <div class="icon">
<i class="fa-brands fa-instagram"></i>
</div>
        <div class="text">
          <strong>Instagram</strong>
          <span>Acompanhe nossas novidades</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <!-- GOOGLE -->
     <a id="google" class="option"
         rel="noopener noreferrer">
       <div class="icon">
  <i class="fa-brands fa-google"></i>
</div>
        <div class="text">
          <strong>Avaliar no Google</strong>
          <span>Compartilhe sua experiência</span>
        </div>
        <div class="arrow">›</div>
      </a>

    </section>

    <footer class="footer">
     <i class="fa-solid fa-signal"></i> Encoste seu celular novamente para acessar</div>
      <div>Rápido, simples e seguro.</div>
    </footer>

  </main>
	<script>
 
const clientes = {
1: {
nome: "Tio Sam",
whatsapp: "https://wa.me/5519992881839",
instagram: "https://instagram.com/hotdogtiosam",
google: "https://www.google.com/search?q=hot+dog+tio+sam&rlz=1C1GCEB_enUS1076US1076&oq=hot+dog+tio+sam&gs_lcrp=EgZjaHJvbWUqCQgAECMYJxjjAjIJCAAQIxgnGOMCMgwIARAuGCcYrwEYxwEyCAgCEAAYFhgeMggIAxAAGBYYHjIICAQQABgWGB4yCAgFEAAYFhgeMggIBhAAGBYYHjIKCAcQABiABBiiBNIBCDQ2ODdqMGo3qAIIsAIB8QVklycauUpFow&sourceid=chrome&source=chrome.ob&ie=UTF-8&safe=active&ssui=on"
},
 
2: {
nome: "Cliente 2",
whatsapp: "https://wa.me/5519997417729",
instagram: "https://instagram.com/madu_q10",
google: "https://google.com"
}
};

3: {
nome: "Cliente 3",
whatsapp: "https://wa.me/5519999854416",
instagram: "https://instagram.com/oifellipy",
google: "https://google.com"
},

const params = new URLSearchParams(window.location.search);

const clienteId = params.get("cliente");

const cliente = clientes[clienteId];

if(cliente){

  document.getElementById("titulo").innerText =
    cliente.nome;

  document.getElementById("whatsapp").href =

  document.getElementById("instagram").href =

  document.getElementById("google").href =
    cliente.google;
}
 
</script>
</body>
</html>
